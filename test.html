<form action="contact.php" method="POST" id="Contact Form">
    <div class="row g-3">
        <div class="col-12">
            <div class="form-floating">
                <input type="text" class="form-control" id="name" name="name" placeholder="Your Name" required>
                <label for="name">Your Name</label>
            </div>
        </div>
        <div class="col-md-12">
            <div class="form-floating">
                <input type="email" class="form-control" id="email" name="email" placeholder="Your Email" required>
                <label for="email">Your Email</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-floating">
                <input type="text" class="form-control" id="company" name="company" placeholder="Company Name">
                <label for="company">Company Name</label>
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-floating">
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="Your Phone">
                <label for="phone">Your Phone</label>
            </div>
        </div>
        <div class="col-12">
            <div class="form-floating">
                    <p>Subject/Product of Interest:</p>
                    <select id="subject" name="subject" placeholder="Product of Interest">
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="LDPE">LDPE</option>
                    <option value="HDPE">HDPE</option>
                    <option value="LLDPE">LLDPE</option>
                    <option value="Polyethylene Wax">Polyethylene Wax</option>
                    <option value="Propylene">Propylene</option>
                    <option value="POE">POE</option>
                    <option value="PCR">PCR</option>
                </select>
            </div>
        </div>
        <div class="col-12">
            <div class="form-floating">
                <textarea class="form-control" placeholder="Leave a message here" id="message" name="message" required
                    style="height: 150px"></textarea>
                <label for="message">Message</label>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-gm py-3 px-5" type="submit">Send Message</button>
        </div>
        <div style="display:none;">
            <input type="text" name="website">
        </div>
    </div>
</form>
